name: NES.emu mapper195 headless test

on:
  push:
    paths:
      - 'NES.emu/**'
      - '.github/workflows/headless-test.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: mapper195 headless acceptance test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Install zlib dev
      run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
    - name: Build and run
      run: bash NES.emu/headless-test/build.sh
    # NOTE: no ROM files here, ever. Game ROMs must not be published to this
    # repository (releases, artifacts or git). To test against a real ROM,
    # run the harness locally: bash NES.emu/headless-test/build.sh your.rom
    - name: Upload rendered screens (synthetic ROM only)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rendered-screens
        path: build-headless/screen_*.pgm
        if-no-files-found: ignore
